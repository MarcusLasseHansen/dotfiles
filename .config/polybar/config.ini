[global/wm]
margin-top    = 0
margin-bottom = 0
include-file = $HOME/.config/polybar/colors.ini
include-file = $HOME/.config/polybar/modules/sys_info.ini
include-file = $HOME/.config/polybar/modules/network.ini
include-file = $HOME/.config/polybar/modules/audio.ini
include-file = $HOME/.config/polybar/modules/util.ini
include-file = $HOME/.config/polybar/modules/misc.ini

[bar/primary-top]
enable-ipc = true

bottom = false

fixed-center = true

width = 100%
height = 18pt

border-size = 0pt
border-color = ${colors.bg-4}

line-size = 1pt

padding-left = 0pt
padding-right = 0pt

module-margin-left = 0pt
module-margin-right = 0pt

background = ${colors.bg-4}
foreground = ${colors.fg-1}

font-0 = ShureTechMono Nerd Font:size=14;4
font-1 = ShureTechMono Nerd Font:size=22;5
font-2 = ShureTechMono Nerd Font:size=26;6
font-3 = ShureTechMono Nerd Font:size=16;4

#modules-left = left xworkspaces-0 space  slash xwindows right
#modules-right = left network space pulseaudio space battery slash language slash date space time right
modules-left = space space xworkspaces-0 space space space xwindows space
modules-right = space network space pulseaudio space battery space space language space space date space time space space 

wm-restock = i3


