[module/language]
type = internal/xkeyboard
label-layout = %layout%
format-background = ${colors.bg-1}
format-foreground = ${colors.fg-2}

[module/xworkspaces-0]
type = internal/xworkspaces
icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;6
icon-6 = 7;7
icon-7 = 8;8
icon-8 = 9;9
icon-9 = 10;10

label-active = %icon%
# label-active-underline= ${colors.blue-1}
label-active-background = ${colors.bg-1}
label-active-foreground= ${colors.ice-2}
label-active-padding = 1

label-occupied = %icon%
label-occupied-padding = 1
label-occupied-background = ${colors.bg-1}

label-urgent = %icon%
label-urgent-background = ${colors.bg-1}
label-urgent-foreground = ${colors.red-1}
label-urgent-padding = 1

label-empty = %icon%
label-empty-background = ${colors.bg-1}
label-empty-foreground = ${colors.fg-1}
label-empty-padding = 1


[module/xworkspaces-1]
type = internal/xworkspaces
icon-0 = 5;V
icon-1 = 6;VI
icon-2 = 7;VII
icon-3 = 8;IIX

label-active = %icon%
# label-active-underline= ${colors.blue-1}
label-active-background = ${colors.bg-1}
label-active-foreground= ${colors.blue-2}
label-active-padding = 1

label-occupied = %icon%
label-occupied-padding = 1
label-occupied-background = ${colors.bg-1}

label-urgent = %icon%
label-urgent-background = ${colors.bg-1}
label-urgent-foreground = ${colors.red-1}
label-urgent-padding = 1

label-empty = %icon%
label-empty-background = ${colors.bg-1}
label-empty-foreground = ${colors.fg-1}
label-empty-padding = 1


[module/xwindows]
type = internal/xwindow
label = %title:0:60:...%
label-background = ${colors.bg-1}
label-foreground = ${colors.fg-1}
label-maxlen = 35


[module/date]
type = internal/date
interval = 5
# label-underline = ${2olors.blue-1}
label-background = ${colors.bg-1}
label-foreground = ${colors.fg-1}
time = %d-%m-%Y
label = %time%


[module/time]
type = internal/date
interval = 1
format-prefix = "󰅐  "
# format-prefix-underline = ${colors.blue-1}
format-prefix-background = ${colors.bg-1}
format-prefix-foreground = ${colors.blue-2}
# label-underline = ${colors.blue-1}
label-background = ${colors.bg-1}
label-foreground = ${colors.fg-1}
time = %H:%M 
label = %time%


[module/info-hackspeed]
type = custom/script
exec = ~/.config/scripts/polybar/info-hackspeed.sh
tail = true

# format-underline = ${colors.green-2}
format-background = ${colors.bg-1}
format-foreground = ${colors.green-2}


[module/updates-pacman-aurhelper]
type = custom/script
exec = ~/.config/scripts/polybar/updates-pacman-aurhelper.sh
interval = 600

